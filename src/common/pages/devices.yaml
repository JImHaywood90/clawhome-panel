lvgl:
  pages:
    - id: devices_page
      bg_color: color_bg
      scrollable: false
      widgets:
        # Header with back button
        - obj:
            width: 660
            height: 60
            y: 20
            align: top_mid
            bg_opa: transp
            border_opa: transp
            shadow_opa: transp
            widgets:
              - button:
                  id: devices_back_btn
                  x: 15
                  width: 60
                  height: 60
                  align: left_mid
                  radius: 30
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  pressed:
                    bg_color: color_bg_card_light
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_icons_36
                        text_color: color_teal
                        text: "\U000F004D"
                  on_click:
                    - lvgl.page.show: home_page

              - label:
                  align: center
                  text_font: nunito_28
                  text_color: color_text
                  text: "Devices"

        # Card grid
        - obj:
            id: devices_grid
            y: 100
            width: 660
            height: 540
            align: top_mid
            clickable: false
            scrollable: false
            bg_opa: transp
            border_opa: transp
            shadow_opa: transp
            pad_all: 0
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_evenly
              flex_align_cross: start
              flex_align_track: start
            widgets:

              # Climate card
              - button:
                  id: devices_climate_btn
                  width: 300
                  height: 160
                  radius: 20
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  pressed:
                    bg_color: color_bg_card_light
                  widgets:
                    - label:
                        y: -15
                        align: center
                        text_font: mdi_icons_54
                        text_color: color_amber
                        text: "${climate_icon}"
                    - label:
                        y: 35
                        align: center
                        text_font: nunito_24
                        text_color: color_text
                        text: "Climate"
                  on_click:
                    - lvgl.page.show: climate_page

              # Cover card
              - button:
                  id: devices_cover_btn
                  width: 300
                  height: 160
                  radius: 20
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  pressed:
                    bg_color: color_bg_card_light
                  widgets:
                    - label:
                        y: -15
                        align: center
                        text_font: mdi_icons_54
                        text_color: color_sky
                        text: "${blinds_opened}"
                    - label:
                        y: 35
                        align: center
                        text_font: nunito_24
                        text_color: color_text
                        text: "Blinds"
                  on_click:
                    - lvgl.page.show: ${cover_widget_name_1}_cover_page
                    - delay: 250ms
                    - lambda: |-
                        int covers = ${covers_amount};
                        if (covers >= 2) {
                          lv_obj_clear_flag(id(cover_select_widget), LV_OBJ_FLAG_HIDDEN);
                        }

              # Media Player card
              - button:
                  id: devices_media_player_btn
                  width: 300
                  height: 160
                  radius: 20
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  pressed:
                    bg_color: color_bg_card_light
                  widgets:
                    - label:
                        y: -15
                        align: center
                        text_font: mdi_icons_54
                        text_color: color_green
                        text: "${play_icon}"
                    - label:
                        y: 35
                        align: center
                        text_font: nunito_24
                        text_color: color_text
                        text: "Media"
                  on_click:
                    - lvgl.page.show: media_player_page

              # Lights card (quick shortcut back)
              - button:
                  id: devices_lights_btn
                  width: 300
                  height: 160
                  radius: 20
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  pressed:
                    bg_color: color_bg_card_light
                  widgets:
                    - label:
                        y: -15
                        align: center
                        text_font: mdi_icons_54
                        text_color: color_teal
                        text: "${ceiling_lights_icon}"
                    - label:
                        y: 35
                        align: center
                        text_font: nunito_24
                        text_color: color_text
                        text: "Lights"
                  on_click:
                    - script.execute: switch_to_room_1
                    - delay: 250ms
                    - lambda: |-
                        int rooms = ${rooms_amount};
                        if (rooms >= 2) {
                          lv_obj_clear_flag(id(room_select_widget), LV_OBJ_FLAG_HIDDEN);
                        }
