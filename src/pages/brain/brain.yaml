# ClawHome AI Brain page — shows brain status via HA sensors

substitutions: !include substitutions.yaml

globals:
  - id: clawhome_notification_text
    type: std::string
    restore_value: no
    initial_value: '""'

# Physical button (top button on panel, GPIO0)
binary_sensor:
  - platform: gpio
    id: panel_top_button
    pin:
      number: ${physical_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Panel Button"
    on_click:
      min_length: 50ms
      max_length: 500ms
      then:
        - logger.log: "Button: single press — show brain"
        - if:
            condition: lvgl.is_paused
            then:
              - lvgl.resume:
              - lvgl.widget.redraw:
              - light.turn_on: display_backlight
        - lvgl.page.show: brain_page
    on_double_click:
      min_length: 50ms
      max_length: 400ms
      then:
        - logger.log: "Button: double press — run brain cycle"
        - homeassistant.action:
            action: button.press
            data:
              entity_id: button.clawhome_run_brain_cycle
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - logger.log: "Button: long press — restarting"
          - button.press: restart_btn

button:
  - platform: restart
    id: restart_btn
    name: "Restart Panel"

# HA sensors for brain data
sensor:
  - platform: homeassistant
    id: brain_cycle_count_sensor
    entity_id: sensor.clawhome_cycle_count
    internal: true
    on_value:
      then:
        - lambda: |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f", x);
            lv_label_set_text(id(brain_cycles_value), buf);

  - platform: homeassistant
    id: brain_active_rules_sensor
    entity_id: sensor.clawhome_active_rules
    internal: true
    on_value:
      then:
        - lambda: |-
            char buf[32];
            snprintf(buf, sizeof(buf), "%.0f active", x);
            lv_label_set_text(id(brain_rules_value), buf);

  - platform: homeassistant
    id: brain_pending_rules_sensor
    entity_id: sensor.clawhome_pending_rules
    internal: true
    on_value:
      then:
        - lambda: |-
            int pending = (int)x;
            char buf[32];
            if (pending > 0) {
              snprintf(buf, sizeof(buf), "%d pending", pending);
              lv_obj_set_style_text_color(id(brain_pending_value), lv_color_hex(0xf59e0b), 0);
              char alert_buf[16];
              snprintf(alert_buf, sizeof(alert_buf), "%d alert%s", pending, pending > 1 ? "s" : "");
              lv_label_set_text(id(heating_status), alert_buf);
            } else {
              snprintf(buf, sizeof(buf), "None");
              lv_obj_set_style_text_color(id(brain_pending_value), lv_color_hex(0x64748b), 0);
              lv_label_set_text(id(heating_status), "");
            }
            lv_label_set_text(id(brain_pending_value), buf);

text_sensor:
  - platform: homeassistant
    id: brain_status_sensor
    entity_id: sensor.clawhome_brain_status
    internal: true
    on_value:
      then:
        - lambda: |-
            std::string status = x;
            std::string display_status = status;
            for (auto &c : display_status) c = toupper(c);
            lv_label_set_text(id(brain_status_label), display_status.c_str());

            std::string bottom = "Brain: " + display_status;
            lv_label_set_text(id(bottom_brain_status), bottom.c_str());

            lv_color_t color;
            if (status == "thinking") color = lv_color_hex(0xf59e0b);
            else if (status == "idle") color = lv_color_hex(0x2dd4bf);
            else if (status == "disabled") color = lv_color_hex(0x64748b);
            else color = lv_color_hex(0xf43f5e);
            lv_obj_set_style_text_color(id(brain_status_label), color, 0);
            lv_obj_set_style_text_color(id(bottom_brain_status), color, 0);

  - platform: homeassistant
    id: brain_reasoning_sensor
    entity_id: sensor.clawhome_last_reasoning
    internal: true
    on_value:
      then:
        - lambda: |-
            std::string r = x;
            if (r == "No reasoning yet" || r.empty()) {
              r = "Waiting for next brain cycle...";
            } else if (r.length() > 200) {
              r = r.substr(0, 197) + "...";
            }
            lv_label_set_text(id(brain_reasoning_label), r.c_str());

  - platform: homeassistant
    id: brain_event_brain_sensor
    entity_id: sensor.clawhome_event_brain
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x == "connected") {
              lv_label_set_text(id(brain_eventbrain_value), "Online");
              lv_obj_set_style_text_color(id(brain_eventbrain_value), lv_color_hex(0x22c55e), 0);
            } else {
              lv_label_set_text(id(brain_eventbrain_value), "Offline");
              lv_obj_set_style_text_color(id(brain_eventbrain_value), lv_color_hex(0xf43f5e), 0);
            }

  - platform: homeassistant
    id: clawhome_notification_sensor
    entity_id: input_text.clawhome_notification
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.length() > 0 && x != "unknown") {
              if (x != id(clawhome_notification_text)) {
                id(clawhome_notification_text) = x;
                lv_label_set_text(id(brain_notification_label), x.c_str());
                lv_obj_clear_flag(id(brain_notification_bar), LV_OBJ_FLAG_HIDDEN);
                ESP_LOGI("notify", "Notification: %s", x.c_str());
              }
            } else {
              id(clawhome_notification_text) = "";
              lv_obj_add_flag(id(brain_notification_bar), LV_OBJ_FLAG_HIDDEN);
            }

lvgl:
  pages:
    - id: brain_page
      bg_color: color_bg
      scrollable: false
      widgets:

        # ── HEADER ──
        - obj:
            width: 660
            height: 60
            y: 20
            align: top_mid
            bg_opa: transp
            border_opa: transp
            shadow_opa: transp
            widgets:
              - button:
                  id: brain_back_btn
                  x: 15
                  width: 60
                  height: 60
                  align: left_mid
                  radius: 30
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  pressed:
                    bg_color: color_bg_card_light
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_icons_36
                        text_color: color_teal
                        text: "\U000F004D"
                  on_click:
                    - lvgl.page.show: home_page

              - label:
                  align: center
                  text_font: nunito_28
                  text_color: color_text
                  text: "AI Brain"

              - button:
                  id: brain_run_btn
                  x: -15
                  width: 60
                  height: 60
                  align: right_mid
                  radius: 30
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  pressed:
                    bg_color: color_bg_card_light
                  widgets:
                    - label:
                        align: center
                        text_font: mdi_icons_36
                        text_color: color_teal
                        text: "\U000F040A"
                  on_click:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.clawhome_run_brain_cycle

        # ── STATUS ROW: icon + status + event brain ──
        - obj:
            y: 95
            width: 660
            height: 80
            align: top_mid
            radius: 20
            bg_color: color_bg_card
            border_opa: transp
            shadow_opa: transp
            clickable: false
            widgets:
              # Brain icon
              - label:
                  x: 25
                  align: left_mid
                  text_font: mdi_icons_42
                  text_color: color_teal
                  text: "\U000F09D1"

              # Status text
              - label:
                  id: brain_status_label
                  x: 80
                  align: left_mid
                  text_font: nunito_36
                  text_color: color_teal
                  text: "..."

              # Event brain dot + label (right side)
              - label:
                  id: brain_eventbrain_value
                  x: -25
                  align: right_mid
                  text_font: nunito_20
                  text_color: color_text_dim
                  text_align: right
                  text: "..."

        # ── STATS ROW: cycles + rules side by side ──
        - obj:
            y: 190
            width: 660
            height: 70
            align: top_mid
            bg_opa: transp
            border_opa: transp
            shadow_opa: transp
            clickable: false
            pad_all: 0
            widgets:
              # Cycles card (left)
              - obj:
                  width: 320
                  height: 70
                  align: left_mid
                  radius: 20
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  clickable: false
                  widgets:
                    - label:
                        x: 20
                        y: -10
                        align: left_mid
                        text_font: nunito_18
                        text_color: color_text_dim
                        text: "Cycles"
                    - label:
                        id: brain_cycles_value
                        x: -20
                        y: -10
                        align: right_mid
                        text_font: nunito_28
                        text_color: color_text
                        text_align: right
                        text: "..."

              # Rules card (right)
              - obj:
                  width: 320
                  height: 70
                  align: right_mid
                  radius: 20
                  bg_color: color_bg_card
                  border_opa: transp
                  shadow_opa: transp
                  clickable: false
                  widgets:
                    - label:
                        x: 20
                        y: -10
                        align: left_mid
                        text_font: nunito_18
                        text_color: color_text_dim
                        text: "Rules"
                    - label:
                        id: brain_rules_value
                        x: -20
                        y: -10
                        align: right_mid
                        text_font: nunito_28
                        text_color: color_text
                        text_align: right
                        text: "..."

        # ── PENDING SUGGESTIONS BANNER ──
        - obj:
            y: 275
            width: 660
            height: 50
            align: top_mid
            radius: 15
            bg_color: color_bg_card
            border_opa: transp
            shadow_opa: transp
            clickable: false
            widgets:
              - label:
                  x: 25
                  align: left_mid
                  text_font: nunito_18
                  text_color: color_text_dim
                  text: "Pending Suggestions"
              - label:
                  id: brain_pending_value
                  x: -25
                  align: right_mid
                  text_font: nunito_20
                  text_color: color_text_dim
                  text_align: right
                  text: "..."

        # ── LAST REASONING CARD ──
        - obj:
            y: 340
            width: 660
            height: 180
            align: top_mid
            radius: 20
            bg_color: color_bg_card
            border_opa: transp
            shadow_opa: transp
            clickable: false
            widgets:
              - label:
                  x: 25
                  y: 15
                  align: top_left
                  text_font: nunito_18
                  text_color: color_text_dim
                  text: "Last Reasoning"
              - label:
                  id: brain_reasoning_label
                  x: 25
                  y: 45
                  width: 610
                  height: 120
                  align: top_left
                  text_font: nunito_18
                  text_color: color_text
                  long_mode: WRAP
                  text: "Waiting for HA connection..."

        # ── NOTIFICATION BAR (bottom, hidden by default) ──
        - obj:
            id: brain_notification_bar
            y: 540
            width: 660
            height: 70
            align: top_mid
            radius: 20
            bg_color: color_bg_card
            border_opa: transp
            shadow_opa: transp
            clickable: false
            hidden: true
            widgets:
              - label:
                  x: 25
                  align: left_mid
                  text_font: mdi_icons_36
                  text_color: color_amber
                  text: "\U000F0027"
              - label:
                  id: brain_notification_label
                  x: 70
                  width: 565
                  align: left_mid
                  text_font: nunito_18
                  text_color: color_text
                  long_mode: SCROLL_CIRCULAR
                  text: ""
