packages:
  animations: !include animations.yaml

globals:

  - id: display_lock
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: display_timeout
    type: int
    restore_value: yes
    initial_value: '2'

  # Данные daily прогноза
  - id: forecast_daily_count
    type: int
    initial_value: '0'
  
  - id: forecast_daily_timestamps
    type: time_t[10]
  
  - id: forecast_daily_temps
    type: float[10]
  
  - id: forecast_daily_conditions
    type: std::string[10]
  
  # Данные hourly прогноза
  - id: forecast_hourly_count
    type: int
    initial_value: '0'
  
  - id: forecast_hourly_timestamps
    type: time_t[15]
  
  - id: forecast_hourly_temps
    type: float[15]
  
  - id: forecast_hourly_conditions
    type: std::string[15]


  - id: current_mode
    type: int
    initial_value: '0'  # 0=HOME, 1=WEATHER, 2=INFO, 3=SETTINGS

  - id: is_animating
    type: bool
    restore_value: no
    initial_value: 'false'


number:
  - platform: template
    id: display_timeout_backlight
    name: Backlight timeout
    optimistic: true
    unit_of_measurement: "m"
    initial_value: 10
    restore_value: true
    min_value: -1
    max_value: 720
    step: 1
    mode: box


switch:
  - platform: lvgl
    name: "LVGL lock"
    id: display_lock_switch
    widget: display_lock_btn
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(display_lock) = true;
      - script.execute: display_block_buttons
    on_turn_off:
      - lambda: |-
          id(display_lock) = false;
      - script.execute: display_block_buttons

time:
  - platform: sntp
    id: sntp_time
    timezone: "${timezone}"
    servers:
     - ntp0.ntp-servers.net
     - ntp1.ntp-servers.net
     - ntp2.ntp-servers.net
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update


sensor:

  # Weather forecast daily count
  - platform: homeassistant
    id: weather_forecast_daily_count
    entity_id: sensor.display_tools_forecasts_daily
    internal: true
  
  # Weather forecast hourly count
  - platform: homeassistant
    id: weather_forecast_hourly_count
    entity_id: sensor.display_tools_forecasts_hourly
    internal: true

  # Weather temperature sensor
  - platform: homeassistant
    id: weather_temperature_sensor
    entity_id: "${weather_entity}"
    attribute: temperature
    on_value: 
      then:
        - lvgl.label.update:
            id: weather_temperature_value
            text:
              format: "%.0f°"
              args: [id(weather_temperature_sensor).state]

  # Weather humidity sensor
  - platform: homeassistant
    id: weather_humidity_sensor
    entity_id: "${weather_entity}"
    attribute: humidity
    on_value: 
      then:
        - lvgl.label.update:
            id: weather_humidity_value
            text:
              format: "%.0f%%"
              args: [id(weather_humidity_sensor).state]

  # Weather wind speed sensor
  - platform: homeassistant
    id: weather_wind_speed_sensor
    entity_id: "${weather_entity}"
    attribute: wind_speed
    on_value: 
      then:
        - if:
            condition:
              lambda: return id(weather_wind_speed_unit_sensor).state == "km/h";
            then:
              - lvgl.label.update:
                  id: weather_wind_speed_value
                  text:
                    format: "%.1f "
                    args: [id(weather_wind_speed_sensor).state]
            else:
              - lvgl.label.update:
                  id: weather_wind_speed_value
                  text:
                    format: "%.0f "
                    args: [id(weather_wind_speed_sensor).state]            

  # Home temperature sensor
  - platform: homeassistant
    id: home_temperature_sensor
    entity_id: "${temperature_entity}"
    on_value: 
      then:
        - lvgl.label.update:
            id: circle_home_widget_temp_value
            text:
              format: "%.1f°"
              args: [id(home_temperature_sensor).state]

  # Home humidity sensor
  - platform: homeassistant
    id: home_humidity_sensor
    entity_id: "${humidity_entity}"
    on_value: 
      then:
        - lvgl.label.update:
            id: circle_home_widget_hum_value
            text:
              format: "%.0f%%"
              args: [id(home_humidity_sensor).state]

  # Chip temperature
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    id: esp32_temperature
    update_interval: 30s
    on_value:
      then:
        - lvgl.label.update:
            id: circle_info_widget_cpu_state_value
            text:
              format: "%.1f°"
              args: [id(esp32_temperature).state]

  # WiFi Signal Strength in dBm
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 30s
    unit_of_measurement: "dBm"
    on_value:
      then:
        - lvgl.label.update:
            id: wifi_signal_info_state
            text:
              format: "%.1f dBm"
              args: [id(wifi_signal_db).state]

  # WI-FI Signal Strength in %
  - platform: wifi_signal
    id: wifi_signal_percent
    update_interval: 30s
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    on_value: 
      then:
        - lvgl.label.update:
            id: wifi_status
            text_color: !lambda |-
              if (id(wifi_signal_percent).state > 0) {
              return lv_color_hex(0x5CA848);
              }
              return lv_color_hex(0x5CA848);
            text: !lambda |-
              if (id(wifi_signal_percent).state > 0 && id(wifi_signal_percent).state < 26) {
              return "${wifi_25_icon}";
              } else if (id(wifi_signal_percent).state > 25 && id(wifi_signal_percent).state < 51) {
              return "${wifi_50_icon}";
              } else if (id(wifi_signal_percent).state > 50 && id(wifi_signal_percent).state < 76) {
              return "${wifi_75_icon}";
              } else if (id(wifi_signal_percent).state > 75) {
              return "${wifi_100_icon}";
              }
              return "${wifi_100_icon}";

text_sensor:

  # Sun horizon sensor
  - platform: homeassistant
    id: sun_state_sensor
    entity_id: sun.sun

  # Weather state sensor
  - platform: homeassistant
    id: weather_state_sensor
    entity_id: "${weather_entity}"
    on_value: 
      then:
        - delay: 1s
        - script.execute: update_weather_image
        - script.execute: update_home_translations

  # Weather forecast daily sensor
  - platform: homeassistant
    id: weather_forecast_daily_sensor
    entity_id: sensor.display_tools_forecasts_daily
    attribute: forecasts
    internal: true
    on_value:
      then:
        - script.execute: parse_daily_forecasts

  # Weather forecast hourly sensor
  - platform: homeassistant
    id: weather_forecast_hourly_sensor
    entity_id: sensor.display_tools_forecasts_hourly
    attribute: forecasts
    internal: true
    on_value:
      then:
        - script.execute: parse_hourly_forecasts


  # Weather wind speed unit sensor
  - platform: homeassistant
    id: weather_wind_speed_unit_sensor
    entity_id: "${weather_entity}"
    attribute: wind_speed_unit    
    on_value: 
      then:
        - lvgl.label.update:
            id: weather_wind_speed_unit
            text: !lambda return x;

  # IP address
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip_address
      on_value:
        then:
          - lvgl.label.update:
              id: ip_address_info_state
              text: !lambda return id(wifi_ip_address).state.c_str();

  # MAC address
  - platform: wifi_info
    mac_address:
      name: "WiFi MAC"
      id: wifi_mac_address
      on_value:
        then:
          - lvgl.label.update:
              id: mac_address_info_state
              text: !lambda return id(wifi_mac_address).state.c_str();

  # ESPHome version with compilation date
  - platform: template
    name: "ESPHome Version"
    id: esphome_version
    lambda: |-
      return {ESPHOME_VERSION};
    on_value:
      then:
        - lvgl.label.update:
            id: esphome_version_info_state
            text: !lambda 'return id(esphome_version).state;'

lvgl:

  on_idle:
    timeout: !lambda "return (id(display_timeout_backlight).state * 60 * 1000);"
    then:
      - if:
          condition:
            lambda: 'return id(display_timeout_backlight).state >= 0;'
          then:
            - logger.log: "LVGL idle — showing screensaver"
            - lvgl.page.show: screensaver_page
            - light.turn_on:
                id: display_backlight
                brightness: 20%
            - script.execute: update_screensaver
          else:
            - logger.log: "LVGL idle, but timeout disabled"

  pages:
    - id: home_page
      bg_color: color_black
      scrollable: false
      on_swipe_down:
        - script.execute:
            id: switch_to_mode
            target_mode: 3
      on_swipe_up:
        - script.execute:
            id: switch_to_mode
            target_mode: 2
      on_swipe_left:
        - script.execute:
            id: switch_to_mode
            target_mode: 1
      on_swipe_right:
        - script.execute:
            id: switch_to_mode
            target_mode: 0
      widgets:
        # indicators — ClawHome simplified
        - obj:
            id: home_bg_indicators
            y: 15
            width: 690
            height: 60
            align: TOP_MID
            pad_all: 0
            bg_opa: transp
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            widgets:

              # Wi-Fi status
              - label:
                  id: wifi_status
                  align: left_mid
                  x: 30
                  text: "${wifi_100_icon}"
                  text_color: color_text_dim
                  text_font: icons_36

              # ClawHome connection status (replaces HA icon)
              - label:
                  id: ha_status
                  align: left_mid
                  x: 90
                  text: "\U000F09D1"
                  text_color: color_teal
                  text_font: mdi_icons_36

              # Lock status (hidden by default, shown when locked)
              - label:
                  id: lock_status
                  align: left_mid
                  x: 150
                  text: "${lock_icon}"
                  text_color: color_text_dim
                  text_font: icons_36

              # Alerts count (right side)
              - label:
                  id: heating_status
                  align: right_mid
                  x: -30
                  text: ""
                  text_color: color_amber
                  text_font: nunito_24

              # Hidden placeholders (keep IDs so scripts don't break)
              - label:
                  id: ac_status
                  align: right_mid
                  x: -90
                  text: ""
                  text_color: color_text_dim
                  text_font: icons_36
              - label:
                  id: alarm_panel_status
                  align: right_mid
                  x: -150
                  text: ""
                  text_color: color_text_dim
                  text_font: mdi_icons_36

        # weather

        - obj:
            id: main_widget_background
            hidden: false
            y: 90
            width: 660
            height: 330
            align: top_mid
            clickable: false
            scrollable: false
