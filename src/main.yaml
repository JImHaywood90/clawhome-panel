packages:
  audio: !include clawhome-panel/services/audio.yaml
  loading: !include clawhome-panel/common/pages/loading.yaml
  home: !include clawhome-panel/pages/home/home.yaml
  light: !include clawhome-panel/pages/light/config.yaml
  devices: !include clawhome-panel/common/pages/devices.yaml
  climate: !include clawhome-panel/pages/climate/climate.yaml
  cover: !include clawhome-panel/pages/cover/config.yaml
  media_player: !include clawhome-panel/pages/media_player/media_player.yaml
  brain: !include clawhome-panel/pages/brain/brain.yaml

image: !include clawhome-panel/common/images.yaml
font: !include clawhome-panel/common/fonts.yaml
color: !include clawhome-panel/common/colors.yaml
substitutions: !include clawhome-panel/common/substitutions.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  includes:
    - <sstream>
    - <algorithm>
  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page
    - priority: -100
      then:
        - lvgl.roller.update:
            id: backlight_settings_sleep_time_roller
            selected_index: !lambda return id(display_timeout);

globals:
  - id: screensaver_active
    type: bool
    restore_value: no
    initial_value: 'false'

esp32:
  board: esp32-p4-evboard
  flash_size: 32Mb
  cpu_frequency: 400MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: UART0

# debug:

psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

# ethernet:
#   type: IP101
#   mdc_pin: GPIO31
#   mdio_pin: GPIO52
#   clk: 
#     pin: GPIO50
#     mode: CLK_EXT_IN
#   phy_addr: 1
#   power_pin: GPIO51

esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

# update:
#   - platform: esp32_hosted
#     name: C6_update
#     path: network_adapter.bin
#     sha256: 1b1f6619689543c8a929db56db98a5663965bae9671a4a16436a90f4baa0f012

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - lvgl.label.update:
        id: wifi_status
        text_color: color_green
  on_disconnect:
    - lvgl.label.update:
        id: wifi_status
        text_color: color_steel_blue

display:
  - platform: mipi_dsi
    model: WAVESHARE-P4-86-PANEL
    reset_pin:
      number: 27
      inverted: false

i2c:
  sda: GPIO7
  scl: GPIO8
  scan: true
  frequency: 400kHz
  id: i2c_bus

touchscreen:
  platform: gt911
  id: touchscreen_
  # address: 0x14
  on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: display_backlight
      - if:
          condition:
            lambda: 'return id(screensaver_active);'
          then:
            - logger.log: "Waking from screensaver"
            - globals.set:
                id: screensaver_active
                value: 'false'
            - lvgl.page.show: home_page
            - light.turn_on:
                id: display_backlight
                brightness: 100%

output:
  - platform: ledc
    id: backlight_
    pin: GPIO26
    frequency: 100Hz
    inverted: true
    min_power: 0.0
    max_power: 0.8 # To prevent overheating due to excessive lighting
    
light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_
    id: display_backlight
    restore_mode: ALWAYS_ON
    on_turn_on:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming by backlight on"
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(display_timeout_backlight).state >= 0;'
          then:
            - logger.log: "Backlight off, pausing LVGL"
            - lvgl.pause:

api:
  encryption:
    key: !secret waveshare_key

ota:
  - platform: esphome
    id: ota_state
    password: !secret waveshare_ota
    on_begin: 
      - logger.log: "OTA Start"
      - light.turn_on: display_backlight
      - lambda: "id(display_backlight).loop();"
      - lvgl.resume:
      - lvgl.widget.redraw:
      - lvgl.label.update:
          id: ota_label_primary
          text: "OTA Update"
      - lvgl.label.update:
          id: ota_label_secondary
          text: "Starting..."
      - lvgl.widget.show: ota_widget
      - lvgl.resume:
      - lvgl.widget.redraw:
      - lambda: "id(lvgl_component).loop();"
      - lambda: "id(lvgl_component).loop();"
      - logger.log: "OTA widget shown"

    on_progress: 
      - lvgl.bar.update:
          id: ota_bar_value
          value: !lambda return (int)x;
      - lvgl.label.update:
          id: ota_label_primary
          text: " "
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            static char buffer[64];
            snprintf(buffer, sizeof(buffer), "Progress: %d%%", (int)x);
            return buffer;
      - lambda: "id(lvgl_component).loop();"

    on_end:
      - logger.log: "OTA End"
      - lvgl.bar.update:
          id: ota_bar_value
          value: 100
      - lvgl.label.update:
          id: ota_label_primary
          text: "Update Complete"
      - lvgl.label.update:
          id: ota_label_secondary
          text: "Restarting..."
      - lambda: |-
          id(lvgl_component).loop();

    on_error:
      - logger.log:
            format: "OTA update error %d"
            args: ["x"]
      - lvgl.label.update:
          id: ota_label_primary
          text: "Update Failed"
      - lvgl.label.update:
          id: ota_label_secondary
          text: "Please try again"
      - lambda: |-
          id(lvgl_component).loop();

lvgl:
  id: lvgl_component
  buffer_size: 100%
  byte_order: little_endian
  touchscreens:
    - touchscreen_id: touchscreen_
      long_press_time: 5000ms
      long_press_repeat_time: 400ms
  page_wrap: false
  top_layer:
    widgets:
      - obj:
          id: ota_widget
          hidden: true
          width: 720
          height: 720
          align: center
          clickable: false
          bg_color: color_slate_blue_gray
          border_opa: transp
          shadow_opa: transp
          radius: 0
          widgets:
            - label:
                id: ota_label_primary
                y: -75
                align: center
                text_font: nunito_20
                text_color: color_misty_blue
                text: "Starting OTA!"
            - label:
                id: ota_label_secondary
                y: -30
                align: center
                text_font: nunito_18
                text_color: color_misty_blue
                text: "Wait..."
            - bar:
                id: ota_bar_value
                y: 30
                width: 450
                value: 0
                align: center
                min_value: 0
                max_value: 100
                animated: true
                bg_color: color_steel_blue
                indicator:
                  bg_color: color_misty_blue
      - obj:
          id: voice_indicator
          hidden: true
          y: 30
          width: 250
          height: 50
          align: top_mid
          radius: 25
          bg_color: 0x0f172a
          border_color: 0x2dd4bf
          border_width: 2
          shadow_opa: transp
          widgets:
            - label:
                id: voice_indicator_label
                align: center
                text_font: nunito_24
                text_color: 0x2dd4bf
                text: "Listening..."


http_request:
  verify_ssl: false



